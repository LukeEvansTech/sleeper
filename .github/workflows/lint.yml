name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Top-level: read-only by default (CKV2_GHA_1). Write scopes live at job level.
permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/super-linter.yml@89cad0963c5ba9e692f5d214d81551bb65e821df # v1
    with:
      soft-launch: false
