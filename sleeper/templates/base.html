<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}sleeper{% endblock %}</title>
<link rel="preload" href="/static/fonts/Archivo-VF.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/app.css">
<script>
  // Set the saved theme before first paint, so a dark page never flashes light.
  try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (_e) {}
</script>
<script src="/static/app.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/">sleeper</a>
  <nav>
    {% set here = request.url.path %}
    <a href="/" {{ 'aria-current=page' if here == '/' or here.startswith('/deal') }}>Deals</a>
    <a href="/ended" {{ 'aria-current=page' if here.startswith('/ended') }}>Ended</a>
    <a href="/wants" {{ 'aria-current=page' if here.startswith('/wants') and here != '/wants/new' }}>Wants</a>
    <a href="/wants/new" {{ 'aria-current=page' if here == '/wants/new' }}>Add card</a>
    <a href="/summary" {{ 'aria-current=page' if here.startswith('/summary') }}>Summary</a>
    <a href="/ops" {{ 'aria-current=page' if here.startswith('/ops') or here.startswith('/run') }}>Runs</a>
  </nav>
  <div class="tools">
    <button type="button" data-open-search aria-keyshortcuts="Meta+K Control+K">Search<kbd>⌘K</kbd></button>
    <button type="button" data-theme-toggle aria-label="Switch between light and dark">Dark</button>
  </div>
</header>
<main>
{% block body %}{% endblock %}
</main>
<footer class="foot">sleeper {{ version }}. Prices are eBay.com US listings, landed at the Oregon forwarding address.</footer>
<dialog class="palette" aria-label="Search wants and deals">
  <input type="search" placeholder="Search cards, sets and deals" aria-controls="palette-results" autocomplete="off">
  <ul id="palette-results" role="listbox"></ul>
</dialog>
</body>
</html>
