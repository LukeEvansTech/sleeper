name: Security Scans

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Top-level: read-only by default. The scan job opts into security-events: write for SARIF upload.
permissions:
  contents: read

jobs:
  scan:
    permissions:
      contents: read
      security-events: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/security-scans.yml@89cad0963c5ba9e692f5d214d81551bb65e821df # v1
    with:
      checkov-frameworks: github_actions,dockerfile
      trivy-scanners: vuln,secret,misconfig
